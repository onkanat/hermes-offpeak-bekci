name: offpeak-bekci
version: "0.1.0"
# manifest_version 2 = config_schema (ayar beyanı) alanını taşıyan sürüm.
manifest_version: 2
description: >-
  Ollama Cloud off-peak penceresini görünür kılar: başlık çubuğu rozeti pencerenin geri
  sayımını ve onay bekleyen/onaylı iş kalemlerini gösterir, pencere başlamadan
  `on_bildirim_dk` dakika önce (varsayılan 30) bir kez toast uyarır ve onayı
  `/offpeak-onayla <id,id>` ile kullanıcıdan alır (onaysız iş koşmaz). Gövde tarafında
  `llm_execution` middleware'i yalnız Ollama Cloud çağrılarında, yalnız peak penceresinde,
  son `pencere_sn` saniyedeki çağrı sayısı `hedef_hiz_dk` hedefini aştıysa tavanlı kısa bir
  bekleme uygular; `kota_penceresi_sn` penceresinde `kota_tavani` aşılırsa uyarı kaydı yazar
  (istek iptal edilmez). Varsayılan `kuru_kosu: true` — eklenti ölçer, geciktirmez.
  `off_peak_only_isler` bir beyandır; eklenti kendi kendine hiçbir zamanlanmış iş kurmaz.
  Ağ çağrısı yok, telemetri yok, sır okumaz; yalnız `kuyruk_dosyasi` ayarının gösterdiği
  yerel dosya (varsayılan `~/.hermes/offpeak-bekci/kuyruk.md`) okunur. Kullanıcıya özel
  hiçbir yol/değer eklentiye gömülmez: tüm ayarlar aşağıda `config_schema` ile beyan
  edilmiştir ve yerindeki (kuruluma özel) değerler `config.yaml` → `offpeak-bekci:` bloğundan,
  masaüstünde ayrıca `ctx.config` üzerinden gelir.
author: "Hakan Kılıçaslan (onkanat)"
license: MIT
homepage: https://github.com/onkanat/hermes-offpeak-bekci
tags:
  - cost
  - rate-limit
  - ollama
  - desktop
  - tr
requires_env: []
python_dependencies: []
provides_tools: []
provides_hooks:
  - on_session_end
provides_middleware:
  - llm_execution

# ── Komutlar ────────────────────────────────────────────────────────────────────────────
# `/offpeak-durum`   → pencere/geri sayım/kota/kuyruk durumu (JSON; masaüstü rozeti okur)
# `/offpeak-onayla`  → kuyruk kalemlerini onaylı yapar (onaysız iş koşmaz)
# `/offpeak-kur`     → opt-in off-peak cron işinin PLANINI basar: iş adı, zamanlama, prompt,
#                      monitör, workdir, enabled_toolsets, teslim + plan_hash. Hiçbir şey
#                      kurmaz; `onayla <plan_hash> [duraklat]` ile yalnız kurulum İSTEĞİNİ
#                      oturuma bırakır ve işi ajanın kendi cron aracı (`cronjob_manage`) kurar.
# `/offpeak-kaldir`  → kurulu offpeak işlerini listeler (id/ad/zamanlama/durum/sonraki koşu);
#                      `onayla <job_id>` ile yalnız kaldırma İSTEĞİNİ oturuma bırakır.
#
# AÇIKLAMA (disclosure):
#   * Eklenti cron deposuna (`<profil>/cron/jobs.json`) HİÇBİR koşulda YAZMAZ — yalnız okur
#     (`bekci_kurulum.py` + `_kurulum_isleri_oku`). Depo yolu **genel yüzeyden** türetilir
#     (`hermes_constants.get_hermes_home()` → `<profil evi>/cron/jobs.json`); çekirdeğin özel
#     modülü (`cron.jobs`) import EDİLMEZ (katalog kural 9); o çağrı (`load_jobs`) dizin açan
#     `ensure_dirs()` yaptığı için zaten kullanılmaz. Kurulum/kaldırma kullanıcı onayı olmadan
#     başlamaz; onay planın kendi `plan_hash`ine bağlıdır.
#   * Kullanıcıya özel hiçbir yol/anahtar plan şablonuna gömülmez: kuyruk yolu `kuyruk_dosyasi`
#     ayarından, pencere beyanı `schedule` ayarından gelir; monitör betiği adı görelidir
#     (`offpeak_bekci.py`) ve cron motoru onu profilin `scripts/` dizininde çözer.
#   * Ağ çağrısı, telemetri, sır okuma yoktur.

# ── Ayarlar (tek beyan kaynağı) ─────────────────────────────────────────────────────────
#
# ETKİN DEĞER SIRASI (yüksekten düşüğe) — uygulama: `bekci_core.AYAR_KATMAN_SIRASI`:
#   1. `config.yaml` → `offpeak-bekci:` bloğu  (kuruluma özel, kullanıcı ONAYLI eşikler)
#   2. `plugins.entries.<id>.settings.*` (`ctx.config`) — bloğun bildirmediği anahtarları doldurur
#   3. bu dosyadaki `default` (hiçbir katman yoksa kullanılan genel değer)
#
# Sıra şartnameden gelir (W4a-1, 16.10.2026 md.2): onaylı eşiği masaüstü/`ctx` değeri sessizce
# gevşetemez. `default` değerleri GENELdir: bu makinede onaylanmış eşikler (16.10.2026, t_358cb364)
# `config.yaml` bloğunda durur ve varsayılanı ezer — eklenti onların kopyasını tutmaz. Aşağıdaki
# "yerinde değer config.yaml'dadır" notlu anahtarlar bu yüzden bilinçli olarak genel varsayılana
# sahiptir (ör. hedef_hiz_dk 6 ≠ onaylı 15).
#
# `bekci_core.VARSAYILAN_AYARLAR` bu dosyadan okunur (tek doğruluk kaynağı); `tests/test_ayarlar.py`
# iki tarafın ayrışmasını test eder. Bir ayar ekler/değiştirirken İKİ yeri değil, burayı düzeltin.
config_schema:
  # Yalnız ölç, geciktirme. Canlıya almak için config.yaml'da `kuru_kosu: false`.
  kuru_kosu:
    type: bool
    default: true
    description: "true iken eklenti yalnız ölçer ve kaydeder, bekleme uygulamaz (kuru koşu)."
  # Onay bekleyen kalemlerin okunduğu defter (kullanıcı dosyası — eklenti içeriğini üretmez).
  kuyruk_dosyasi:
    type: str
    default: "~/.hermes/offpeak-bekci/kuyruk.md"
    description: >-
      Bekleyen iş kalemlerinin okunduğu yerel defter yolu. `~` ve ortam değişkenleri
      genişletilir. Kullanıcıya özel yerler (ör. ana çalışma alanı) buraya değil,
      kurulumun config.yaml bloğuna yazılır.
  # Off-peak penceresinin açıldığı an (cron, UTC, 5 alan). Eklenti bu işi kendisi KURMAZ:
  # `/offpeak-kur` yalnız plan basar; onaydan sonra işi ajanın cron aracı kurar. Monitörsüz
  # varyantta iş bu beyana, monitörlü varyantta 5 dakikalık poll + monitör kapısına dayanır.
  schedule:
    type: str
    default: "5 18 * * 1-5"
    description: >-
      Off-peak iş kuyruğunun koşacağı an (cron ifadesi, UTC; 5 alan: dk saat gün ay hafta-günü).
      Varsayılan 18:05 UTC = 21:05 TR, hafta içi. Eklenti cron deposuna yazmaz; bu beyan
      `/offpeak-kur` planında kullanılır ve doğrulanır.
  # Off-peak'e kaç dakika kala hatırlatma (toast) penceresi başlar.
  on_bildirim_dk:
    type: int
    default: 30
    description: "Rozet/toast uyarısı pencere açılmadan bu kadar dakika önce başlar."
  # Kaynak tavanları — yerinde değer config.yaml'dadır. 0 = tavan yok (yalnız raporlar).
  kota_token_gun:
    type: int
    default: 0
    description: >-
      Günlük taze token (girdi+çıktı) tavanı; aşılırsa uyarı kaydı. 0 = tavan yok.
      Yerinde (onaylı) değer config.yaml bloğundadır.
  cache_read_tavani_gun:
    type: int
    default: 0
    description: >-
      Günlük cache-read token tavanı; aşılırsa uyarı kaydı. 0 = tavan yok.
      Yerinde (onaylı) değer config.yaml bloğundadır.
  hedef_hiz_dk:
    type: int
    default: 6
    description: >-
      Peak penceresinde dakikada en fazla kaç çağrı (kayan `pencere_sn` saniyelik pencere).
      Yerinde (onaylı) değer config.yaml bloğundadır.
  erteleme_tavani_sn:
    type: float
    default: 30.0
    description: >-
      Tek bir istek için uygulanacak en fazla bekleme (sn) — gecikmenin tavanı.
      Yerinde (onaylı) değer config.yaml bloğundadır.
  off_peak_only_isler:
    type: list
    default: []
    description: >-
      Yalnız off-peak penceresinde koşması gereken iş adları (beyan; onaylı liste
      config.yaml bloğundadır). Eklenti bu işleri kendisi kurmaz/koşturmaz.
  # ── İç ayarlar (uygulama sabitleri; genelde değiştirilmez) ────────────────────────────
  pencere_sn:
    type: float
    default: 60.0
    description: "Hedef hızın ölçüldüğü kayan pencerenin uzunluğu (sn)."
  kota_penceresi_sn:
    type: float
    default: 3600.0
    description: "Kota sayacının penceresi (sn)."
  kota_tavani:
    type: int
    default: 120
    description: "Kota penceresinde en fazla çağrı; tavan aşılırsa uyarı kaydı yazılır."
  olcum_dosyasi:
    type: str
    default: "~/.hermes/offpeak-bekci/olcum.jsonl"
    description: "Ölçüm/uyarı günlüğü (JSONL, yerel; ağ yok). `~` genişletilir."
