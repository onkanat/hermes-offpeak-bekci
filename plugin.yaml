name: offpeak-bekci
version: "0.1.8"
# manifest_version 2 = config_schema (ayar beyanı) alanını taşıyan sürüm.
manifest_version: 2
description: >-
  Makes Ollama Cloud's off-peak window visible and actionable: a status-bar chip shows the
  countdown and the queue item counts (window definition: Ollama's off-peak hours, weekday
  18:00-12:00 UTC, weekends one block), a one-shot notice fires 30 minutes before the window
  opens, and approval is only ever taken from the user via `/offpeak-onayla <id,id>` — work only
  runs if approved. On the body side an `llm_execution` middleware — only for Ollama Cloud calls,
  only inside the peak window — applies a capped short sleep when the call rate in the last 60 s
  exceeds the target rate (default 6/min); when the hourly quota ceiling (default 120/h) is
  exceeded it writes an alert record and does not cancel the request. Default `kuru_kosu: true` —
  the plugin measures, it never delays; to go live set `offpeak-bekci.kuru_kosu: false` in
  config.yaml. The `on_session_end` hook writes a window/quota/queue summary to the local log.
  Install is opt-in: `/offpeak-kur` prints the cron job it would install in full (job name,
  schedule, the whole prompt, monitor, workdir, toolsets, delivery) and asks for a `plan_hash`;
  approval is bound to that hash and only the install REQUEST is left to the session — the
  agent's own cron tool installs the job. Auto-delivery is host-dependent (measured:
  `hermes_cli/plugins_injection.py:18-32`): in a classic CLI session the request enters the
  agent's queue; on the Ink TUI / desktop-panel host the core asks for a persistent `session_key`
  which is not given to the command handler, so the command prints the parameters as a single
  line of JSON (the agent's cron tool still installs it; the user hands the request to the agent).
  The only way to read that key is the private core module `gateway.session_context` (rule 9 →
  not used); injecting into a gateway additionally requires
  `plugins.entries.offpeak-bekci.allow_gateway_injection: true` (default off). `/offpeak-kaldir`
  lists installed jobs and `onayla <job_id>` leaves a removal request (id · schedule · state ·
  next run); the same host limit applies. Dry runs use `duraklat` (`paused:true`).
  Language: command descriptions, command output and notices are English by default; set
  `dil: tr` for Turkish (code comments stay Turkish).
  Disclosure — no network calls, no telemetry, never reads/writes secrets, never runs a
  shell/process, never downloads remote code, never self-updates. The plugin never writes the cron
  store (`jobs.json`) under any circumstance; it is read-only (the path is derived from public
  surface; `load_jobs()`, which creates directories, is not used). Local files it reads: the queue
  ledger named by `kuyruk_dosyasi` (default `~/.hermes/offpeak-bekci/kuyruk.md`) and the cron store.
  Where it writes: `olcum_dosyasi` (JSONL measurement/alerts, default
  `~/.hermes/offpeak-bekci/olcum.jsonl`) and — only when the user runs `/offpeak-onayla` — that one
  queue file, atomically (the plugin does not generate its content; it is the user's file). The
  desktop half `desktop/plugin.js` uses only the plugin SDK surface (no prototype patching, no
  eval, no DOM querying).
author: "Hakan Kılıçaslan (onkanat)"
license: MIT
homepage: https://github.com/onkanat/hermes-offpeak-bekci
tags:
  - cost
  - rate-limit
  - ollama
  - desktop
  - tr
requires_env: []
python_dependencies: []
provides_tools: []
provides_hooks:
  - on_session_end
provides_middleware:
  - llm_execution

# ── Komutlar ────────────────────────────────────────────────────────────────────────────
# `/offpeak-durum`   → pencere/geri sayım/kota/kuyruk durumu — **okunur rapor** (varsayılan);
#                      `json` argümanı tek satır JSON döner ve masaüstü rozeti onu okur
# `/offpeak-onayla`  → kuyruk kalemlerini onaylı yapar (onaysız iş koşmaz)
# `/offpeak-kur`     → opt-in off-peak cron işinin PLANINI basar: iş adı, zamanlama, prompt,
#                      monitör, workdir, enabled_toolsets, teslim + plan_hash. Hiçbir şey
#                      kurmaz; `onayla <plan_hash> [duraklat]` ile yalnız kurulum İSTEĞİNİ
#                      oturuma bırakır ve işi ajanın kendi cron aracı (`cronjob_manage`) kurar.
# `/offpeak-kaldir`  → kurulu offpeak işlerini listeler (id/ad/zamanlama/durum/sonraki koşu);
#                      `onayla <job_id>` ile yalnız kaldırma İSTEĞİNİ oturuma bırakır.
#
# AÇIKLAMA (disclosure):
#   * Eklenti cron deposuna (`<profil>/cron/jobs.json`) HİÇBİR koşulda YAZMAZ — yalnız okur
#     (`bekci_kurulum.py` + `_kurulum_isleri_oku`). Depo yolu **genel yüzeyden** türetilir
#     (`hermes_constants.get_hermes_home()` → `<profil evi>/cron/jobs.json`); çekirdeğin özel
#     modülü (`cron.jobs`) import EDİLMEZ (katalog kural 9); o çağrı (`load_jobs`) dizin açan
#     `ensure_dirs()` yaptığı için zaten kullanılmaz. Kurulum/kaldırma kullanıcı onayı olmadan
#     başlamaz; onay planın kendi `plan_hash`ine bağlıdır.
#   * Kullanıcıya özel hiçbir yol/anahtar plan şablonuna gömülmez: kuyruk yolu `kuyruk_dosyasi`
#     ayarından, pencere beyanı `schedule` ayarından gelir; monitör betiği adı görelidir
#     (`offpeak_bekci.py`) ve cron motoru onu profilin `scripts/` dizininde çözer.
#   * "İsteği oturuma bırakma" HOST'A BAĞLIDIR (ölçüm: `hermes_cli/plugins_injection.py:18-32`):
#     klasik CLI oturumunda istek ajanın kuyruğuna girer (dönüş True); Ink TUI / masaüstü-panel
#     host'unda çekirdek kalıcı `session_key` ister ve o anahtar komut handler'ına verilmediği
#     için dönüş False olur — komut kurulacak parametreleri tek satır JSON olarak basar, işi
#     kullanıcı ajana vererek kurdurur. (Anahtarı okumanın tek yolu `gateway.session_context`
#     özel çekirdek modülünden geçer; kural 9 gereği kullanılmaz. Gateway'e enjeksiyon ayrıca
#     `plugins.entries.offpeak-bekci.allow_gateway_injection: true` ister — varsayılan kapalı.)
#   * Ağ çağrısı, telemetri, sır okuma yoktur.

# ── Ayarlar (tek beyan kaynağı) ─────────────────────────────────────────────────────────
#
# ETKİN DEĞER SIRASI (yüksekten düşüğe) — uygulama: `bekci_core.AYAR_KATMAN_SIRASI`:
#   1. `config.yaml` → `offpeak-bekci:` bloğu  (kuruluma özel, kullanıcı ONAYLI eşikler)
#   2. `plugins.entries.<id>.settings.*` (`ctx.config`) — bloğun bildirmediği anahtarları doldurur
#   3. bu dosyadaki `default` (hiçbir katman yoksa kullanılan genel değer)
#
# Sıra şartnameden gelir (W4a-1, 16.10.2026 md.2): onaylı eşiği masaüstü/`ctx` değeri sessizce
# gevşetemez. `default` değerleri GENELdir: bu makinede onaylanmış eşikler (16.10.2026, t_358cb364)
# `config.yaml` bloğunda durur ve varsayılanı ezer — eklenti onların kopyasını tutmaz. Aşağıdaki
# "yerinde değer config.yaml'dadır" notlu anahtarlar bu yüzden bilinçli olarak genel varsayılana
# sahiptir (ör. hedef_hiz_dk 6 ≠ onaylı 15).
#
# `bekci_core.VARSAYILAN_AYARLAR` bu dosyadan okunur (tek doğruluk kaynağı); `tests/test_ayarlar.py`
# iki tarafın ayrışmasını test eder. Bir ayar ekler/değiştirirken İKİ yeri değil, burayı düzeltin.
config_schema:
  # Yalnız ölç, geciktirme. Canlıya almak için config.yaml'da `kuru_kosu: false`.
  kuru_kosu:
    type: bool
    default: true
    description: "true iken eklenti yalnız ölçer ve kaydeder, bekleme uygulamaz (kuru koşu)."
  # Arayüz dili: `en` (varsayılan — katalog kartı ve komut çıktıları her dilde okunur) veya `tr`.
  dil:
    type: str
    default: "en"
    description: >-
      Language for command descriptions, command output and notices: `en` (default) or `tr`.
      Turkish output stays available with `dil: tr`.
  # Onay bekleyen kalemlerin okunduğu defter (kullanıcı dosyası — eklenti içeriğini üretmez).
  kuyruk_dosyasi:
    type: str
    default: "~/.hermes/offpeak-bekci/kuyruk.md"
    description: >-
      Bekleyen iş kalemlerinin okunduğu yerel defter yolu. `~` ve ortam değişkenleri
      genişletilir. Kullanıcıya özel yerler (ör. ana çalışma alanı) buraya değil,
      kurulumun config.yaml bloğuna yazılır.
  # Off-peak penceresinin açıldığı an (cron, UTC, 5 alan). Eklenti bu işi kendisi KURMAZ:
  # `/offpeak-kur` yalnız plan basar; onaydan sonra işi ajanın cron aracı kurar. Monitörsüz
  # varyantta iş bu beyana, monitörlü varyantta 5 dakikalık poll + monitör kapısına dayanır.
  schedule:
    type: str
    default: "5 18 * * 1-5"
    description: >-
      Off-peak iş kuyruğunun koşacağı an (cron ifadesi, **UTC**; 5 alan: dk saat gün ay hafta-günü).
      Varsayılan 18:05 UTC = 21:05 TR, hafta içi. Hermes'in cron zamanlayıcısı ifadeyi **yerel**
      saatle yorumlar (ölçüldü); bu yüzden `/offpeak-kur` planı UTC beyanını yerel karşılığına
      çevirir (yaz saati farkı dahil, gün kayması varsa hafta-günü de kaydırılır) ve onu kurar.
      Eklenti cron deposuna yazmaz; bu beyan planda kullanılır ve doğrulanır.
  # Off-peak'e kaç dakika kala hatırlatma (toast) penceresi başlar.
  on_bildirim_dk:
    type: int
    default: 30
    description: "Rozet/toast uyarısı pencere açılmadan bu kadar dakika önce başlar."
  # Kaynak tavanları — yerinde değer config.yaml'dadır. 0 = tavan yok (yalnız raporlar).
  kota_token_gun:
    type: int
    default: 0
    description: >-
      Günlük taze token (girdi+çıktı) tavanı; aşılırsa uyarı kaydı. 0 = tavan yok.
      Yerinde (onaylı) değer config.yaml bloğundadır.
  cache_read_tavani_gun:
    type: int
    default: 0
    description: >-
      Günlük cache-read token tavanı; aşılırsa uyarı kaydı. 0 = tavan yok.
      Yerinde (onaylı) değer config.yaml bloğundadır.
  hedef_hiz_dk:
    type: int
    default: 6
    description: >-
      Peak penceresinde dakikada en fazla kaç çağrı (kayan `pencere_sn` saniyelik pencere).
      Yerinde (onaylı) değer config.yaml bloğundadır.
  erteleme_tavani_sn:
    type: float
    default: 30.0
    description: >-
      Tek bir istek için uygulanacak en fazla bekleme (sn) — gecikmenin tavanı.
      Yerinde (onaylı) değer config.yaml bloğundadır.
  off_peak_only_isler:
    type: list
    default: []
    description: >-
      Yalnız off-peak penceresinde koşması gereken iş adları (beyan; onaylı liste
      config.yaml bloğundadır). Eklenti bu işleri kendisi kurmaz/koşturmaz.
  # ── İç ayarlar (uygulama sabitleri; genelde değiştirilmez) ────────────────────────────
  pencere_sn:
    type: float
    default: 60.0
    description: "Hedef hızın ölçüldüğü kayan pencerenin uzunluğu (sn)."
  kota_penceresi_sn:
    type: float
    default: 3600.0
    description: "Kota sayacının penceresi (sn)."
  kota_tavani:
    type: int
    default: 120
    description: "Kota penceresinde en fazla çağrı; tavan aşılırsa uyarı kaydı yazılır."
  olcum_dosyasi:
    type: str
    default: "~/.hermes/offpeak-bekci/olcum.jsonl"
    description: "Ölçüm/uyarı günlüğü (JSONL, yerel; ağ yok). `~` genişletilir."
